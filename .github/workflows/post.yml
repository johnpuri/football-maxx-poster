name: Post Football Highlights

on:
  schedule:
    - cron: "0 8 * * *"  # daily 08:00 UTC
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm start
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          FACEBOOK_ACCOUNT_ID: ${{ secrets.FACEBOOK_ACCOUNT_ID }}
          HIGHLIGHTLY_RAPIDAPI_KEY: ${{ secrets.HIGHLIGHTLY_RAPIDAPI_KEY }}
          SCOREBAT_TOKEN: ${{ secrets.SCOREBAT_TOKEN }}
          CLUB_COUNTRY_RATIO: "0.8"
